# Hardware overlay — NVIDIA A100 80 GB (single GPU, 27B model)
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.a100.yml \
#                  --env-file .env --env-file .env.a100 up -d

services:
  medgemma:
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - VLLM_ENV=a100
      - VLLM_MODEL=google/medgemma-27b-it
